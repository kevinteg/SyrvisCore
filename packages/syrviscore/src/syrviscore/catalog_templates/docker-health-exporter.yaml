# Bundled catalog template — the estate container-state exporter. Emits container
# running / health / restart / started metrics via docker-socket-proxy (no host
# access), scraped by vmagent at :9066 → up{job="docker-health"}.
#
# IMAGE: the OWNED, non-root build (images/docker-state-exporter/) — our CI rebuild
# of karugaru/docker_state_exporter (MIT, ~240 LoC Go, vendored + auditable) on a
# distroless static base, USER nonroot, provenance+SBOM. Pinned by DIGEST. This
# replaces the previous ANONYMOUS, unmaintained, root fviolence image. It emits
# container_state_* metrics; the vmagent scrape relabels them back to the estate's
# stable docker_container_* contract (profile_data/monitoring/vmagent-scrape.yml),
# so the dashboards, alert rules, and dashboard.py's Collector need NO change.
# (Interim upstream pin if you don't build the owned image:
#  karugaru/docker_state_exporter@sha256:99d984a57dd11d0d3b53d56481dec51be7a0ad7c2a7aa80a95db2facd294c60a)
name: docker-health-exporter
version: "1.0.0"
image: ghcr.io/kevinteg/docker-state-exporter@sha256:a8af92185465704bb67893e39019a5dec9cd5091c3df7344c62f150a5053d511
description: "Container state metrics (docker_state_exporter) via docker-socket-proxy"
homepage: "https://github.com/karugaru/docker_state_exporter"

restart: unless-stopped

# Reach the Docker API via the socket-proxy over `proxy` (NOT the host socket).
# The docker SDK's NewEnvClient() honors DOCKER_HOST. Serve /metrics on :9066 so
# the scrape target is unchanged (upstream defaults to :8080).
environment:
  - "DOCKER_HOST=tcp://docker-socket-proxy:2375"
command:
  - "-listen-address=:9066"

resources:
  memory: "128m"
