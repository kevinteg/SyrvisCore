# Image trust registry — the curated provenance assertion `syrvis images` validates
# against (image_provenance.py). Keyed by <registry>/<repository> (canonical, as
# parse_image_ref produces: bare Docker Hub names become docker.io/library/<name>).
# publisher_class ∈ official | verified | sponsored-oss | trusted-org | community | unknown
#   trusted for the status glyph: official, verified, sponsored-oss, trusted-org.
#   community/unknown → ⚠ (vet before trusting). GHCR carries NO reputability signal,
#   so ghcr.io/* is trusted ONLY by explicit assertion here.
# expected_base: the base you expect (drift from it is reported).
# eol_product: the endoflife.date product id (nullable).
# Reflects the 2026-07-24 fleet audit. Extend/override at $SYRVIS_HOME/trust/image_trust.yaml.

# ── Core tier ────────────────────────────────────────────────────────────────
docker.io/library/traefik:
  publisher_class: official
  expected_base: alpine
  eol_product: traefik
  source: https://github.com/traefik/traefik
docker.io/portainer/portainer-ce:
  publisher_class: verified
  expected_base: alpine
  eol_product: null
  source: https://github.com/portainer/portainer
docker.io/cloudflare/cloudflared:
  publisher_class: verified
  expected_base: distroless
  eol_product: null
  source: https://github.com/cloudflare/cloudflared
ghcr.io/kevinteg/syrviscore-dashboard:
  publisher_class: trusted-org      # first-party (SyrvisCore CI build)
  expected_base: python:3.12-slim
  eol_product: python
  source: https://github.com/kevinteg/SyrvisCore
docker.io/favonia/cloudflare-ddns:
  publisher_class: community        # single-maintainer (but high-signal + cosign-signed, scratch)
  expected_base: scratch
  eol_product: null
  source: https://github.com/favonia/cloudflare-ddns

