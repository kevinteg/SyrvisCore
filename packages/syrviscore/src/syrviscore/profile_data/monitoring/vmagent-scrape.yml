# vmagent scrape config — GENERIC default seeded by `syrvis profile enable
# monitoring` (written only if absent; a deployment overrides it by streaming
# its own via `syrvis deploy` or editing data/vmagent/config/scrape.yml).
# Prometheus scrape_configs format. Targets are container names on the proxy net.

global:
  scrape_interval: 60s
  scrape_timeout: 30s

scrape_configs:
  # Host OS metrics (node_exporter, infra tier). -> up{job="node"}
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # Container state (docker-health-exporter -> docker-socket-proxy).
  # -> up{job="docker-health"} + docker_container_running / _health_status.
  # The exporter (docker_state_exporter) emits container_state_* names; the
  # relabels below rename them to the estate's stable docker_container_* contract,
  # so dashboards / alert rules / dashboard.py's Collector are untouched. Keeping
  # job_name: docker-health preserves up{job="docker-health"}.
  - job_name: docker-health
    static_configs:
      - targets:
          - docker-health-exporter:9066
    metric_relabel_configs:
      # running: one-hot over 7 states -> keep status=running, rename.
      - source_labels: [__name__, status]
        regex: 'container_state_status;(paused|restarting|removing|dead|created|exited)'
        action: drop
      - source_labels: [__name__]
        regex: container_state_status
        target_label: __name__
        replacement: docker_container_running
      # health one-hot (none/starting/healthy/unhealthy): status label already
      # matches the contract -> rename the metric only.
      - source_labels: [__name__]
        regex: container_state_health_status
        target_label: __name__
        replacement: docker_container_health_status
      - source_labels: [__name__]
        regex: container_restartcount
        target_label: __name__
        replacement: docker_container_restart_count
      - source_labels: [__name__]
        regex: container_state_startedat
        target_label: __name__
        replacement: docker_container_started_at_seconds
      # drop exporter-only + Go-runtime series to hold cardinality down.
      - source_labels: [__name__]
        regex: 'container_state_(oomkilled|finishedat)|go_.*|process_.*|promhttp_.*'
        action: drop

  # Hardware health via SNMP (RAID/SMART/UPS/temps) — deployment-specific:
  # needs an snmp-exporter service plus an snmp.yml carrying your SNMPv3
  # credentials (stream both via `syrvis deploy`). Standard snmp_exporter
  # indirection shown; replace <NAS_IP> and enable when ready.
  # - job_name: snmp-synology
  #   metrics_path: /snmp
  #   params:
  #     module: [synology]
  #     auth: [synology_v3]
  #   static_configs:
  #     - targets: ["<NAS_IP>"]
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: snmp-exporter:9116
