# Build + push the SyrvisCore dashboard container image from CI (no local Docker
# needed). The dashboard bakes the `syrviscore` library into its image and ships
# in LOCKSTEP with the service: it is tagged at syrviscore.__version__ and must be
# rebuilt whenever EITHER the dashboard package or the syrviscore it bakes changes
# — otherwise its baked schema lags the CLI (mis-flagging valid declarations) or
# the compose pin points at a tag CI never published.
name: dashboard-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "packages/syrviscore-dashboard/**"
      - "packages/syrviscore/**"
      - ".github/workflows/dashboard-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service version (lockstep tag)
        id: ver
        run: |
          v=$(grep '^__version__' \
            packages/syrviscore/src/syrviscore/__version__.py \
            | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Service version (image tag): $v"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the REPO ROOT — the Dockerfile COPYs packages/syrviscore too.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/syrviscore-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/kevinteg/syrviscore-dashboard:${{ steps.ver.outputs.version }}
            ghcr.io/kevinteg/syrviscore-dashboard:latest
